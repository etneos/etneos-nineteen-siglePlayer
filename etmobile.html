<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>etneos</title>
  <link rel="shortcut icon" href="img/xIco4.ico" />
  <style>
    :root{
      --blu: #000078;
      --verde: #38f032;
      --arancio: #ff9d00;
      --testo: #f3f3f3;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--blu);
      color: var(--testo);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-image: url("img/sfondoOk.svg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    .page {
      width: min(100%, 1366px);
      margin: 0 auto;
      padding: 18px 12px 32px;
      position: relative;
    }

    #mobile-menu {
      width: 100%;
      max-width: 700px;
      margin: 0 auto 12px;
      position: relative;
      background: var(--blu);
      border-radius: 0 0 12px 12px;
      overflow: visible;
    }

    #mobile-menu summary {
      list-style: none;
      display: block;
      cursor: pointer;
      padding: 10px 16px;
      text-align: right;
      position: relative;
      user-select: none;
    }

    #mobile-menu summary::-webkit-details-marker { display: none; }

    #burger {
      display: inline-block;
      width: 44px;
      height: 32px;
      position: relative;
      margin-left: auto;
    }

    #burger span {
      display: block;
      width: 100%;
      height: 4px;
      background: #fff;
      margin: 6px 0;
      border-radius: 2px;
    }

    nav {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 30;
      display: none;
    }

    #mobile-menu[open] nav { display: block; }

    nav ul {
      list-style: none;
      margin: 0 auto;
      padding: 10px 0;
      width: min(80vw, 260px);
      background: rgba(0, 0, 0, 0.75);
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    nav ul li {
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav ul li:last-child { border-bottom: none; }

    nav ul a {
      display: block;
      padding: 12px 18px;
      color: var(--verde);
      text-decoration: none;
      font-size: 18px;
      font-style: oblique;
      font-weight: 600;
      text-align: center;
    }

    nav ul a:hover {
      background: var(--arancio);
      color: #fff;
    }

    #tt {
      width: min(92vw, 700px);
      height: clamp(240px, 48vw, 550px);
      margin: 0 auto;
      background: url("img/home_smart5.png") center/contain no-repeat;
      border-radius: 8px;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 24px auto 18px;
      flex-wrap: wrap;
    }

    .social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }

    .social img {
      width: 32px;
      height: 32px;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
    }

    .footer a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 50;
      padding: 24px;
    }

    .overlay.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      position: relative;
      width: min(90vw, 780px);
      background: rgba(0,0,0,.75);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      padding: 18px;
      color: white;
    }

    #idxinfo {
      position: absolute;
      right: 12px;
      top: 12px;
      background: var(--blu);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    #sapiri {
      display: block;
      font-size: clamp(1rem, 2vw, 1.4rem);
      line-height: 1.5;
      color: var(--verde);
    }

    #proverb {
      margin-top: 16px;
      color: var(--arancio);
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .hidden-mobile-ads {
      display: none;
    }

    @media (max-width: 768px) {
      .page {
        padding-left: 8px;
        padding-right: 8px;
      }

      #mobile-menu {
        margin-bottom: 18px;
      }

      .hidden-mobile-ads {
        display: none !important;
      }

      .social {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <details id="mobile-menu">
      <summary>
        <div id="burger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </summary>
      <nav id="nv">
        <ul id="uu">
          <li><a href="javascript:void(0)" onclick="toggle2();">Chi vo' sapiri</a></li>
          <li><a href="javascript:void(0)" onclick="diciannove();">Nineteen-10</a></li>
          <li><a href="https://etneos.altervista.org/" target="_blank" rel="noopener">Blog etneos</a></li>
          <li><a href="https://www.etneos.it/cookie-policy.html" target="_blank" rel="noopener">Cookie-policy</a></li>
          <li><a href="mailto:info@etneos.it" target="_blank" rel="noopener">Info-contatti</a></li>
        </ul>
      </nav>
    </details>

    <div id="tt"></div>

    <div class="social">
      <a href="https://www.facebook.com/profile.php?id=100082760112911" target="_blank" rel="noopener"><img src="img/fbIcon40.png" alt="Facebook"></a>
      <a href="https://www.instagram.com/etneos.it/" target="_blank" rel="noopener"><img src="img/IstIcon40.png" alt="Instagram"></a>
      <a href="https://tiktok.com/@etneos.it" target="_blank" rel="noopener"><img src="img/TikIcon40.png" alt="TikTok"></a>
      <a href="https://t.me/Nineteen_Etneos" target="_blank" rel="noopener"><img src="img/telegramIco32.png" alt="Telegram"></a>
    </div>

    <div class="footer">
      <a href="https://www.etneos.it/privacy-policy.html" target="_blank" rel="noopener">Privacy policy</a>
      &nbsp;|&nbsp;
      <a href="https://www.etneos.it/condizioni-uso.html" target="_blank" rel="noopener">Avvisi</a>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="modal">
      <button id="idxinfo" type="button" onclick="toggle2()">X</button>
      <img id="thewin" alt="" />
      <span id="sapiri">Benvenuti nel micro "cratere" virtuale...</span>
      <p id="proverb">"Voi sapiri qual è 'u megghiu jocu? fai beni e parra pocu!"</p>
    </div>
  </div>

  <script>
    function diciannove(){
      window.open(
        'https://www.etneos.it/nineteen10/nineteen10.htm',
        '_blank',
        'width=' + screen.availWidth + ',height=' + screen.availHeight
      );
    }

    function toggle2(){
      const overlay = document.getElementById('overlay');
      overlay.classList.toggle('show');
    }

    document.addEventListener('click', function (event) {
      const menu = document.getElementById('mobile-menu');
      const target = event.target;
      if (!menu.contains(target)) {
        menu.removeAttribute('open');
      }
    });
  </script>
</body>
</html>
